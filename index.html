<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festa di Compleanno</title>
    <!-- SDK Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- SDK Firebase Compatibili per HTML statico -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #8774e1;
            --subtext-color: #aaaaaa;
            --border-color: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 12px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 4px 15px rgba(135, 116, 225, 0.3);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 0 6px 0;
            text-align: center;
        }

        .description {
            color: var(--subtext-color);
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .list-container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 8px 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .guest-card {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .guest-card:last-child { border-bottom: none; }

        .guest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guest-name { font-weight: 600; }

        .time-badge {
            background-color: rgba(135, 116, 225, 0.2);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .guest-note {
            font-size: 0.85rem;
            color: var(--subtext-color);
            font-style: italic;
        }

        .edit-section {
            width: 100%;
            max-width: 400px;
            margin-top: 16px;
            background-color: var(--card-bg);
            border-radius: 14px;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .edit-section h3 {
            margin: 0 0 10px 0;
            font-size: 0.95rem;
            color: var(--accent-color);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: #fff;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300" class="header-img" alt="Compleanno">
    <h1>Festa di Compleanno! 🎉</h1>
    <div class="description">Inserisci il tuo orario di arrivo e un'eventuale nota per festeggiare insieme.</div>

    <div class="list-container" id="guest-list">
        <div style="text-align:center; color:#aaa; padding:10px;">Caricamento partecipanti...</div>
    </div>

    <div class="edit-section">
        <h3>Aggiorna le tue info</h3>
        <input type="text" id="name-input" placeholder="Il tuo nome">
        <input type="text" id="time-input" placeholder="Orario di arrivo (es. 20:30)">
        <input type="text" id="note-input" placeholder="Nota (es. Porto le bibite)">
        <button onclick="saveDetails()">Salva / Aggiorna</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Configurazione Firebase integrata
        const firebaseConfig = {
            apiKey: "AIzaSyC9N5CSRZXBkL5gfJ_GJ0YGLIKBApJwm8k",
            authDomain: "tgwakrf.firebaseapp.com",
            databaseURL: "https://tgwakrf-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "tgwakrf",
            storageBucket: "tgwakrf.firebasestorage.app",
            messagingSenderId: "245937889905",
            appId: "1:245937889905:web:449337709709c73a8f71d0"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Autocompila con il nome utente di Telegram se presente
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('name-input').value = tg.initDataUnsafe.user.first_name;
        }

        function saveDetails() {
            const name = document.getElementById('name-input').value.trim();
            const time = document.getElementById('time-input').value.trim();
            const note = document.getElementById('note-input').value.trim();

            if (!name) {
                alert("Inserisci almeno il tuo nome!");
                return;
            }

            database.ref('guests/' + name).set({
                time: time || 'Da definire',
                note: note || ''
            }).then(() => {
                if (tg.showAlert) {
                    tg.showAlert("Dati salvati con successo!");
                } else {
                    alert("Dati salvati con successo!");
                }
            });
        }

        // Sincronizzazione in tempo reale con Firebase
        database.ref('guests').on('value', (snapshot) => {
            const listContainer = document.getElementById('guest-list');
            listContainer.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                listContainer.innerHTML = '<div style="text-align:center; color:#aaa; padding:10px;">Nessun partecipante ancora registrato.</div>';
                return;
            }

            for (let name in data) {
                const guest = data[name];
                const card = document.createElement('div');
                card.className = 'guest-card';
                card.innerHTML = `
                    <div class="guest-header">
                        <span class="guest-name">${name}</span>
                        <span class="time-badge">${guest.time}</span>
                    </div>
                    ${guest.note ? `<div class="guest-note">"${guest.note}"</div>` : ''}
                `;
                listContainer.appendChild(card);
            }
        });
    </script>
</body>
</html>
