<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Festa di Compleanno</title>
    <!-- SDK Telegram Web App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #8774e1; /* Viola stile Telegram */
            --subtext-color: #aaaaaa;
            --border-color: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Immagine Titolo al Centro */
        .header-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 16px;
            border: 3px solid var(--accent-color);
            box-shadow: 0 4px 15px rgba(135, 116, 225, 0.3);
        }

        /* Titolo e Descrizione */
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 8px 0;
            text-align: center;
            background: linear-gradient(45deg, #ffffff, var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            color: var(--subtext-color);
            font-size: 0.95rem;
            text-align: center;
            max-width: 90%;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        /* Contenitore Lista Partecipanti */
        .list-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 8px 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .guest-card {
            padding: 14px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .guest-card:last-child {
            border-bottom: none;
        }

        .guest-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .guest-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .time-badge {
            background-color: rgba(135, 116, 225, 0.15);
            color: var(--accent-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .guest-note {
            font-size: 0.85rem;
            color: var(--subtext-color);
            font-style: italic;
        }

        /* Form di modifica personalizzato */
        .edit-section {
            width: 100%;
            max-width: 450px;
            margin-top: 20px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-sizing: border-box;
            border: 1px solid var(--border-color);
        }

        .edit-section h3 {
            margin-top: 0;
            font-size: 1rem;
            color: var(--accent-color);
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: #fff;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Immagine di Copertina al centro -->
    <img src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=300" alt="Compleanno" class="header-img">

    <!-- Titolo Grande e Descrizione -->
    <h1>Festa di Compleanno! 🎉</h1>
    <div class="description">
        Ci vediamo Sabato! Segnate qua sotto l'orario in cui pensate di arrivare e se portate qualcosa.
    </div>

    <!-- Lista Partecipanti -->
    <div class="list-container" id="guest-list">
        <!-- Esempio partecipante -->
        <div class="guest-card">
            <div class="guest-header">
                <span class="guest-name">Marco</span>
                <span class="time-badge">Arrivo: 20:30</span>
            </div>
            <div class="guest-note">"Porto la torta e il prosecco!"</div>
        </div>
    </div>

    <!-- Modulo per aggiornare la propria presenza -->
    <div class="edit-section">
        <h3>Aggiorna i tuoi dettagli</h3>
        <input type="text" id="time-input" placeholder="Orario di arrivo (es. 21:00)">
        <input type="text" id="note-input" placeholder="Nota (es. Porto le patatine)">
        <button onclick="saveDetails()">Salva Informazioni</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function saveDetails() {
            const time = document.getElementById('time-input').value;
            const note = document.getElementById('note-input').value;
            
            // Qui collegheremo il database in tempo reale
            alert("Informazioni salvate!");
        }
    </script>
</body>
</html>
